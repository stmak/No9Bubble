<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - NO.9 Bubble Tea CMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Security: Prevent clickjacking
    if (window.self !== window.top) {
      window.top.location = window.self.location;
    }
  </script>
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-50 to-blue-100 min-h-screen flex items-center justify-center p-4">
  
  <!-- Login Form -->
  <div id="loginForm" class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md border-4 border-pink-200">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">🔐 Admin Login</h1>
      <p class="text-gray-600">NO.9 Bubble Tea CMS</p>
    </div>

    <form id="loginFormElement" class="space-y-6">
      <div>
        <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username"
          autocomplete="username"
          class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-pink-500 focus:ring-2 focus:ring-pink-200 transition-all outline-none"
          required
          minlength="3"
          maxlength="50"
          pattern="[a-zA-Z0-9_]+"
          placeholder="Enter username"
        >
      </div>

      <div>
        <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password"
          autocomplete="current-password"
          class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-pink-500 focus:ring-2 focus:ring-pink-200 transition-all outline-none"
          required
          minlength="8"
          maxlength="128"
          placeholder="Enter password"
        >
      </div>

      <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl" role="alert">
        <span id="errorText"></span>
      </div>

      <button 
        type="submit" 
        id="loginBtn"
        class="w-full bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold py-4 rounded-xl hover:from-pink-600 hover:to-purple-700 transform hover:-translate-y-0.5 transition-all duration-200 shadow-lg"
      >
        Sign In
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-gray-500">
      <p>🔒 Secure admin access only</p>
      <p class="mt-1">Session expires after 30 minutes of inactivity</p>
    </div>
  </div>

  <!-- Success Message (shown after login) -->
  <div id="successMessage" class="hidden text-center">
    <div class="text-6xl mb-4">✅</div>
    <h2 class="text-2xl font-bold text-gray-800 mb-2">Login Successful!</h2>
    <p class="text-gray-600">Redirecting to dashboard...</p>
  </div>

  <script>
    // Security Constants
    const MAX_LOGIN_ATTEMPTS = 5;
    const LOCKOUT_TIME = 15 * 60 * 1000; // 15 minutes
    const SESSION_TIMEOUT = 30 * 60 * 1000; // 30 minutes

    // Rate limiting storage (in localStorage for demo - use server-side in production)
    const getLoginAttempts = () => parseInt(localStorage.getItem('loginAttempts') || '0');
    const setLoginAttempts = (count) => localStorage.setItem('loginAttempts', count.toString());
    const getLockoutTime = () => parseInt(localStorage.getItem('lockoutTime') || '0');
    const setLockoutTime = (time) => localStorage.setItem('lockoutTime', time.toString());

    // Check if account is locked out
    function isLockedOut() {
      const lockout = getLockoutTime();
      if (lockout && Date.now() < lockout) {
        return true;
      } else if (lockout && Date.now() >= lockout) {
        // Lockout expired, reset
        localStorage.removeItem('lockoutTime');
        localStorage.removeItem('loginAttempts');
      }
      return false;
    }

    // Record failed attempt
    function recordFailedAttempt() {
      const attempts = getLoginAttempts() + 1;
      setLoginAttempts(attempts);
      
      if (attempts >= MAX_LOGIN_ATTEMPTS) {
        const lockoutUntil = Date.now() + LOCKOUT_TIME;
        setLockoutTime(lockoutUntil);
        return true; // Account locked
      }
      return false;
    }

    // Sanitize input to prevent XSS
    function sanitizeInput(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Show error message
    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      errorText.textContent = sanitizeInput(message);
      errorDiv.classList.remove('hidden');
    }

    // Hide error message
    function hideError() {
      document.getElementById('errorMessage').classList.add('hidden');
    }

    // Validate credentials (DEMO - use server-side auth in production)
    // IMPORTANT: In production, NEVER store passwords client-side. This is for demonstration only.
    // Replace with actual backend authentication API call.
    async function validateCredentials(username, password) {
      // DEMO CREDENTIALS - CHANGE THESE IMMEDIATELY
      // In production, this should be an API call to your backend
      const validCredentials = {
        'admin': 'SecureP@ssw0rd123!', // Change this!
        'manager': 'ManagerP@ss2024!'   // Change this!
      };

      // Simulate network delay for security (prevents timing attacks)
      await new Promise(resolve => setTimeout(resolve, 1000 + Math.random() * 500));

      if (validCredentials[username] === password) {
        return { success: true, role: username === 'admin' ? 'admin' : 'editor' };
      }
      return { success: false };
    }

    // Create secure session
    function createSession(user) {
      const sessionData = {
        username: user.username,
        role: user.role,
        loginTime: Date.now(),
        lastActivity: Date.now(),
        sessionId: crypto.randomUUID()
      };
      
      // Store session securely
      localStorage.setItem('cmsSession', JSON.stringify(sessionData));
      
      // Set session timeout checker
      checkSessionTimeout();
    }

    // Check session timeout
    function checkSessionTimeout() {
      const interval = setInterval(() => {
        const session = JSON.parse(localStorage.getItem('cmsSession') || 'null');
        if (!session) {
          clearInterval(interval);
          return;
        }
        
        if (Date.now() - session.lastActivity > SESSION_TIMEOUT) {
          // Session expired
          localStorage.removeItem('cmsSession');
          window.location.reload();
          clearInterval(interval);
        }
      }, 60000); // Check every minute
    }

    // Update session activity
    function updateSessionActivity() {
      const session = JSON.parse(localStorage.getItem('cmsSession') || 'null');
      if (session) {
        session.lastActivity = Date.now();
        localStorage.setItem('cmsSession', JSON.stringify(session));
      }
    }

    // Handle login
    document.getElementById('loginFormElement').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      // Check lockout
      if (isLockedOut()) {
        const lockout = getLockoutTime();
        const remaining = Math.ceil((lockout - Date.now()) / 60000);
        showError(`Account locked. Try again in ${remaining} minutes.`);
        return;
      }

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');

      // Validate input format
      if (!/^[a-zA-Z0-9_]{3,50}$/.test(username)) {
        showError('Invalid username format');
        return;
      }

      if (password.length < 8 || password.length > 128) {
        showError('Password must be 8-128 characters');
        return;
      }

      // Disable button during login
      loginBtn.disabled = true;
      loginBtn.innerHTML = '⏳ Authenticating...';

      try {
        const result = await validateCredentials(username, password);

        if (result.success) {
          // Reset failed attempts on successful login
          localStorage.removeItem('loginAttempts');
          localStorage.removeItem('lockoutTime');
          
          // Create session
          createSession({ username, role: result.role });
          
          // Show success and redirect
          document.getElementById('loginForm').classList.add('hidden');
          document.getElementById('successMessage').classList.remove('hidden');
          
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1500);
        } else {
          // Record failed attempt
          const locked = recordFailedAttempt();
          if (locked) {
            showError(`Too many failed attempts. Account locked for 15 minutes.`);
          } else {
            const attemptsLeft = MAX_LOGIN_ATTEMPTS - getLoginAttempts();
            showError(`Invalid credentials. ${attemptsLeft} attempts remaining.`);
          }
        }
      } catch (error) {
        console.error('Login error:', error);
        showError('An error occurred. Please try again.');
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = 'Sign In';
      }
    });

    // Check existing session on page load
    window.addEventListener('load', () => {
      const session = JSON.parse(localStorage.getItem('cmsSession') || 'null');
      if (session) {
        if (Date.now() - session.lastActivity < SESSION_TIMEOUT) {
          // Valid session, redirect to dashboard
          window.location.href = 'dashboard.html';
        } else {
          // Expired session, clear it
          localStorage.removeItem('cmsSession');
        }
      }
    });

    // Security headers simulation (set these on your web server)
    console.log('%c🔒 Security Notice', 'color: red; font-size: 20px; font-weight: bold;');
    console.log('Ensure your web server sets these headers:');
    console.log('- X-Frame-Options: DENY');
    console.log('- X-Content-Type-Options: nosniff');
    console.log('- X-XSS-Protection: 1; mode=block');
    console.log('- Strict-Transport-Security: max-age=31536000');
    console.log('- Content-Security-Policy: default-src \'self\'');
  </script>
</body>
</html>
